name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pure engine tests + the no-camera selftest need no camera, no pycaw,
      # no Windows: controller imports are lazy by design.
      - run: pip install pytest
      - name: Pure gesture tests
        run: pytest tests/ -v
      - name: Scripted-event selftest
        run: python -m app.main --selftest
